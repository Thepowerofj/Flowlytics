services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowlytics
      POSTGRES_PASSWORD: flowlytics
      POSTGRES_DB: flowlytics
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowlytics -d flowlytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://flowlytics:flowlytics@db:5432/flowlytics?schema=public
      UPLOAD_DIR: /data/uploads
    volumes:
      - .:/app
      - /app/node_modules
      - uploads:/data/uploads
    command: ["pnpm", "dev"]
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://flowlytics:flowlytics@db:5432/flowlytics?schema=public
      UPLOAD_DIR: /data/uploads
      WORKER_ID: worker-1
    volumes:
      - .:/app
      - /app/node_modules
      - uploads:/data/uploads
    command: ["pnpm", "worker"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
